name: asesor_imagen_ai
description: "Virtual Try-On & Wardrobe Assistant with AI Recommendations"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.2

  # Backend / Auth
  supabase_flutter: ^2.12.4

  # HTTP client
  dio: ^5.9.2

  # Serialization
  json_annotation: ^4.11.0

  # Media
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # Share
  share_plus: ^10.1.4

  # Config
  flutter_dotenv: ^6.0.1

  # Logging
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.14.1
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  assets:
    - .env
