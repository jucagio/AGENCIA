[project]
name = "asesor-imagen-ai"
version = "0.1.0"
description = "AI-powered fashion and image advisor backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "bcrypt==4.2.1",
    "PyJWT[crypto]==2.10.1",
    "postgrest==0.16.6",
    "arq==0.28.0",
    "redis==5.2.1",
    "boto3==1.35.84",
    "Pillow==11.0.0",
    "httpx==0.27.2",
    "google-cloud-vision==3.8.1",
    "replicate==1.0.4",
    "anthropic==0.40.0",
    "stripe==11.4.1",
    "python-json-logger==2.0.7",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-env==1.1.5",
    "respx==0.21.1",
    "ruff==0.8.4",
    "mypy==1.13.0"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120  # increased from 100 — long lines common in FastAPI route definitions

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S", "B"]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # FastAPI standard: Query/Header in default args
    "N818",  # allow AppException (not renamed to AppError to avoid breaking changes)
    "S104",  # binding to all interfaces is expected in Docker / Railway
    "S105",  # false positive — ruff mistakes JWT field names (token_type, access_token) for passwords
    "S106",  # same — test mock values for token fields are not hardcoded credentials
]
