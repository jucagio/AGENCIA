name: teclado_de_senias
description: App para personas sordomudas — aprende y domina el lenguaje de señas.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # HTTP & API
  dio: ^5.3.0
  
  # Supabase (Auth + DB)
  supabase_flutter: ^1.10.0
  
  # Navigation
  go_router: ^10.0.0
  
  # UI Components
  flutter_svg: ^2.0.0
  lottie: ^2.3.0
  
  # Storage
  shared_preferences: ^2.2.0
  
  # Utils
  intl: ^0.18.0
  freezed_annotation: ^2.4.0
  json_serializable: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
